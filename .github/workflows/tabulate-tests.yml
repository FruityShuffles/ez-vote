name: Algorithm golden tests

# Guards the two algorithm sources of truth against behavioral drift:
# tabulation (_shared/tabulate.ts) and ballot derivation (_shared/derive.ts).
# Runs both golden corpora on the same Deno runtime the edge functions use in
# production. The fixtures under _shared/fixtures/ are a frozen corpus — the
# derivation set was generated from the original Dart implementation during the
# React migration and is not regenerated; it is the contract derive.ts must meet.

on:
  push:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/tabulate-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/tabulate-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run algorithm golden tests
        working-directory: supabase/functions
        run: deno task test
